# PROPOSED CI workflow for blazer -- NOT IN FORCE, NOT SUBMITTED.
#
# Emitted by bin/ci-propose.sh (B2 SDK harness) into docs/generated/, which is
# machine-owned: re-running the script overwrites this file, so edit the script,
# not this. It is a PROPOSAL and nothing more -- this harness is report-only, it
# has opened no PR against https://github.com/Backblaze/blazer.git, and it will not. See
# docs/design-docs/autonomy-model.md. The team opens the PR.
#
# Note what this file does NOT contain: the gate. That lives in blazer-ci.sh
# beside it, so the identical check runs locally and here. Everything below is
# toolchain setup.
#
# Coverage floor: 80%. Chosen as a starting line, not derived from
# this SDK's current number -- see the Evidence block at the bottom.

name: CI (blazer)

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash   # turns on pipefail; GitHub's default is `bash -e` WITHOUT it

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true
      - name: Test and enforce the coverage floor
        run: ./ci/blazer-ci.sh

